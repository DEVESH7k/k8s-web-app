apiVersion: apps/v1
kind: Deployment

metadata:
  name: k8s-web-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: k8s-web-app

  template:
    metadata:
      labels:
        app: k8s-web-app

    spec:
      containers:
        - name: k8s-web-app

          image: Image-Name


          ports:
            - containerPort: 80

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "256Mi"
